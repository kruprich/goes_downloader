# The offline tests and pyflakes on every push and pull request, on every supported Python.
# The network tests (pytest --network) download real data and are run by hand.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Pyflakes
        run: python -m pyflakes goes_downloader tests download_raw.py download_mrms.py report.py build_features.py build_geography.py
      - name: Tests
        run: python -m pytest
